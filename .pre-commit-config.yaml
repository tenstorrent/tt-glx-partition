repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cargo fmt --check'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --all-targets --all-features'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

